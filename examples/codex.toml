schema_version = 1

[server]
listen = "127.0.0.1:8081"

[identity]
id = "codex-reviewer"
name = "Codex Reviewer"
description = "Review code with Codex and a selected skill package."

[agent]
kind = "codex"
workspace = ".."
native_config = "./agents/codex/config.toml"
inherit_auth = true
sandbox = "workspace-write"
approval_policy = "on-request"
# executable = "/absolute/path/to/codex"
# model = "an-available-model"

[skills]
directories = ["./skills"]
enabled = ["code-review"]
inherit_user = false

[runtime]
max_concurrent_tasks = 1
queue_capacity = 20
task_timeout_seconds = 1800
session_idle_timeout_seconds = 900

[storage]
directory = "../data/codex-reviewer"

[auth]
mode = "none"

[[capabilities]]
id = "review-code"
name = "Code review"
description = "Inspect code changes and explain actionable findings."
tags = ["code", "review"]
examples = ["Review the uncommitted changes in this repository."]
required_skills = ["code-review"]
