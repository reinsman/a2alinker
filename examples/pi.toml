schema_version = 1

[server]
listen = "127.0.0.1:8080"

[identity]
id = "pi-reviewer"
name = "Pi Reviewer"
description = "Review code with pi and a selected skill package."

[agent]
kind = "pi"
workspace = ".."
# 省略 native_config 会自动读取用户 settings.json 及同目录 models.json，并非不加载配置。
# 默认目录：PI_CODING_AGENT_DIR，未设置时为 ~/.pi/agent。
# native_config = "~/custom-pi/settings.json"
inherit_auth = true
allow_extensions = false
# executable = "/absolute/path/to/pi"
# 如果 pi 依赖 nvm，使用 pi-nvm.toml，或将 executable 设为 "../scripts/pi-nvm"。
# provider = "your-provider"
# model = "your-model"

[skills]
directories = ["./skills"]
enabled = ["code-review"]
inherit_user = false

[runtime]
max_concurrent_tasks = 1
queue_capacity = 20
task_timeout_seconds = 1800
session_idle_timeout_seconds = 900
# 默认转发 pi 公开输出的思考文本、工具参数和执行结果，可按需要分别关闭。
forward_reasoning = true
forward_tools = true

[storage]
directory = "../data/pi-reviewer"

[auth]
mode = "none"

[[capabilities]]
id = "review-code"
name = "Code review"
description = "Inspect code changes and explain actionable findings."
tags = ["code", "review"]
examples = ["Review the uncommitted changes in this repository."]
required_skills = ["code-review"]
