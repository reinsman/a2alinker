name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite:
          - name: library
            args: "-p a2alinker"
          - name: library-logging
            args: "-p a2alinker --features logging"
          - name: workspace
            args: "--workspace"
    name: ${{ matrix.os }} / ${{ matrix.suite.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy ${{ matrix.suite.args }} --all-targets --locked -- -D warnings
      - run: cargo test ${{ matrix.suite.args }} --all-targets --locked
