[workspace]
members = ["crates/a2alinker", "crates/a2alinker-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
# 两个包都禁止自身代码使用 unsafe；不影响单独编译的第三方依赖。
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
