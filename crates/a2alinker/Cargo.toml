[package]
name = "a2alinker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Expose local coding agents through the A2A protocol"

[features]
# 库默认不编译日志；订阅器始终由调用方配置。
default = []
logging = ["dep:tracing"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
ra2a = { version = "=0.10.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tracing = { version = "0.1", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true

[dev-dependencies]
tracing = "0.1"
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
